<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="footer mark">
  <style>
    :root{
      --line:#e2e8f0; --accent:#2563eb; --soft:#dbeafe; --muted:#94a3b8; --bg:#ffffff;
    }
    @media (prefers-color-scheme: dark){
      :root{ --line:#1f2937; --accent:#60a5fa; --soft:#1e3a5f; --muted:#5b6b85; --bg:#0b0f19; }
    }
    text{ font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
    .orbit{ transform-box: fill-box; transform-origin: 600px 46px; animation: f-spin 12s linear infinite; }
    @keyframes f-spin{ to{ transform: rotate(360deg); } }
    .glow{ animation: f-pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 600px 46px; }
    @keyframes f-pulse{ 0%,100%{ opacity:.5 } 50%{ opacity:1 } }
  </style>

  <defs>
    <linearGradient id="ft-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--line)" stop-opacity="0" />
      <stop offset="100%" stop-color="var(--line)" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="ft-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--line)" stop-opacity="1" />
      <stop offset="100%" stop-color="var(--line)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <line x1="0" y1="46" x2="520" y2="46" stroke="url(#ft-l)" stroke-width="1.5" />
  <line x1="680" y1="46" x2="1200" y2="46" stroke="url(#ft-r)" stroke-width="1.5" />

  <circle cx="600" cy="46" r="26" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 5" />
  <g class="orbit">
    <circle cx="626" cy="46" r="2.6" fill="var(--accent)" />
  </g>
  <circle class="glow" cx="600" cy="46" r="5" fill="var(--soft)" />
  <circle cx="600" cy="46" r="3" fill="var(--accent)" />

  <text x="600" y="98" text-anchor="middle" font-size="11" fill="var(--muted)">DESIGNED &amp; BUILT WITH INTENTION</text>
</svg>
