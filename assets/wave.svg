<svg width="1200" height="80" viewBox="0 0 1200 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="wave divider">
  <style>
    :root{ --line:#2563eb; --soft:#dbeafe; }
    @media (prefers-color-scheme: dark){ :root{ --line:#60a5fa; --soft:#1e3a5f; } }
    .wave{ animation: w-flow 8s linear infinite; }
    @keyframes w-flow{ to{ transform: translateX(-300px); } }
  </style>

  <defs>
    <linearGradient id="w-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="12%" stop-color="white" stop-opacity="1" />
      <stop offset="88%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="w-mask"><rect width="1200" height="80" fill="url(#w-fade)" /></mask>
  </defs>

  <g mask="url(#w-mask)">
    <g class="wave">
      <path d="M-300 40 C -225 10, -150 10, -75 40 S 75 70, 150 40 S 300 10, 375 40 S 525 70, 600 40 S 750 10, 825 40 S 975 70, 1050 40 S 1200 10, 1275 40 S 1425 70, 1500 40"
            stroke="var(--line)" stroke-width="1.6" fill="none" opacity=".55" />
    </g>
    <circle cx="600" cy="40" r="3" fill="var(--line)" />
    <circle cx="600" cy="40" r="8" fill="var(--soft)" opacity=".55" />
  </g>
</svg>
