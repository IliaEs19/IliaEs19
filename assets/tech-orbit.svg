<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="technology orbit visualization">
  <style>
    :root{
      --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
      --accent:#2563eb; --soft:#dbeafe; --ring:#e2e8f0;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --card:#10151f; --border:#1f2937; --text:#e2e8f0; --muted:#7c8aa5;
        --accent:#60a5fa; --soft:#1e3a5f; --ring:#1f2937;
      }
    }
    text{ font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sweep{ transform-box: fill-box; transform-origin: 320px 320px; animation: to-spin 16s linear infinite; }
    @keyframes to-spin{ to{ transform: rotate(360deg); } }
    .core{ animation: to-pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 320px 320px; }
    @keyframes to-pulse{ 0%,100%{ opacity:.7; transform:scale(1);} 50%{ opacity:1; transform:scale(1.12);} }
    .spoke{ stroke-dasharray: 5 5; animation: to-draw 4.5s linear infinite; }
    @keyframes to-draw{ to{ stroke-dashoffset:-100; } }
    .badge{ animation: to-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b0{ animation-delay:0s } .b1{ animation-delay:.4s } .b2{ animation-delay:.8s } .b3{ animation-delay:1.2s }
    .b4{ animation-delay:1.6s } .b5{ animation-delay:2s } .b6{ animation-delay:2.4s } .b7{ animation-delay:2.8s }
    @keyframes to-float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  </style>

  <defs>
    <filter id="to-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="320" cy="320" r="130" fill="none" stroke="var(--ring)" stroke-width="1.5" stroke-dasharray="2 6" />
  <circle cx="320" cy="320" r="250" fill="none" stroke="var(--ring)" stroke-width="1.5" stroke-dasharray="2 6" />

  <g class="sweep">
    <line x1="320" y1="320" x2="320" y2="70" stroke="var(--accent)" stroke-width="1.5" opacity=".35" />
    <circle cx="320" cy="70" r="3" fill="var(--accent)" opacity=".6" />
  </g>

  <circle class="core" cx="320" cy="320" r="9" fill="var(--accent)" filter="url(#to-glow)" />
  <circle cx="320" cy="320" r="9" fill="var(--accent)" />

  <!-- spokes: inner ring -->
  <line class="spoke" x1="320" y1="320" x2="411.9" y2="228.1" stroke="var(--accent)" stroke-width="1.2" opacity=".45" />
  <line class="spoke" x1="320" y1="320" x2="411.9" y2="411.9" stroke="var(--accent)" stroke-width="1.2" opacity=".45" />
  <line class="spoke" x1="320" y1="320" x2="228.1" y2="411.9" stroke="var(--accent)" stroke-width="1.2" opacity=".45" />
  <line class="spoke" x1="320" y1="320" x2="228.1" y2="228.1" stroke="var(--accent)" stroke-width="1.2" opacity=".45" />
  <!-- spokes: outer ring -->
  <line class="spoke" x1="320" y1="320" x2="570" y2="320" stroke="var(--muted)" stroke-width="1.2" opacity=".3" />
  <line class="spoke" x1="320" y1="320" x2="320" y2="570" stroke="var(--muted)" stroke-width="1.2" opacity=".3" />
  <line class="spoke" x1="320" y1="320" x2="70"  y2="320" stroke="var(--muted)" stroke-width="1.2" opacity=".3" />
  <line class="spoke" x1="320" y1="320" x2="320" y2="70"  stroke="var(--muted)" stroke-width="1.2" opacity=".3" />

  <!-- ===== inner ring badges ===== -->

  <!-- React -->
  <g class="badge b0" transform="translate(411.9,228.1)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <g stroke="var(--accent)" stroke-width="1.3" fill="none">
      <ellipse rx="15" ry="6" />
      <ellipse rx="15" ry="6" transform="rotate(60)" />
      <ellipse rx="15" ry="6" transform="rotate(120)" />
    </g>
    <circle r="2.4" fill="var(--accent)" />
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">React</text>
  </g>

  <!-- TypeScript -->
  <g class="badge b1" transform="translate(411.9,411.9)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">TS</text>
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">TypeScript</text>
  </g>

  <!-- Next.js -->
  <g class="badge b2" transform="translate(228.1,411.9)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <path d="M-10,9 L-10,-9 L10,10" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="8" y1="-9" x2="8" y2="10" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" />
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">Next.js</text>
  </g>

  <!-- Tailwind CSS -->
  <g class="badge b3" transform="translate(228.1,228.1)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <path d="M-13,-3 C -9,-10 -1,-10 3,-4 C 7,1 11,1 14,-3 C 10,4 2,4 -2,-2 C -6,-7 -10,-7 -13,-3 Z" fill="var(--accent)" />
    <path d="M-13,7 C -9,0 -1,0 3,6 C 7,11 11,11 14,7 C 10,14 2,14 -2,8 C -6,3 -10,3 -13,7 Z" fill="var(--accent)" opacity=".55" />
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">Tailwind</text>
  </g>

  <!-- ===== outer ring badges ===== -->

  <!-- Node.js -->
  <g class="badge b4" transform="translate(570,320)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <path d="M0,-14 L12,-7 V7 L0,14 L-12,7 V-7 Z" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round" />
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">Node.js</text>
  </g>

  <!-- PostgreSQL -->
  <g class="badge b5" transform="translate(320,570)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">PG</text>
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">PostgreSQL</text>
  </g>

  <!-- Git -->
  <g class="badge b6" transform="translate(70,320)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <g stroke="var(--accent)" stroke-width="1.4" fill="none">
      <circle cx="-8" cy="-9" r="3.2" />
      <circle cx="-8" cy="9" r="3.2" />
      <circle cx="8" cy="0" r="3.2" />
      <path d="M-8,-6 V6" />
      <path d="M-5,-2 C -1,-2 4,-2 5,-1" />
    </g>
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">Git</text>
  </g>

  <!-- Vite -->
  <g class="badge b7" transform="translate(320,70)">
    <circle r="32" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
    <path d="M-11,-12 L9,-12 L-1,2 L8,2 L-9,14 L-3,-1 L-12,-1 Z" fill="var(--accent)" />
    <text x="0" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">Vite</text>
  </g>
</svg>
