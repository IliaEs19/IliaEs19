<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="technology orbit visualization">
  <style>
    .float{ animation: to-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b0{ animation-delay:0s } .b1{ animation-delay:.35s } .b2{ animation-delay:.7s } .b3{ animation-delay:1.05s }
    .b4{ animation-delay:1.4s } .b5{ animation-delay:1.75s } .b6{ animation-delay:2.1s } .b7{ animation-delay:2.45s }
    @keyframes to-float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-9px); } }

    .spin-cw{ transform-box: fill-box; transform-origin: 500px 500px; animation: to-spin-cw 40s linear infinite; }
    .spin-ccw{ transform-box: fill-box; transform-origin: 500px 500px; animation: to-spin-ccw 55s linear infinite; }
    @keyframes to-spin-cw{ to{ transform: rotate(360deg); } }
    @keyframes to-spin-ccw{ to{ transform: rotate(-360deg); } }

    .orb-pulse{ animation: to-orb 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 500px 500px; }
    @keyframes to-orb{ 0%,100%{ transform: scale(1); opacity:.9; } 50%{ transform: scale(1.06); opacity:1; } }

    .dot{ animation: to-dot 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .dt0{ animation-delay:0s } .dt1{ animation-delay:.4s } .dt2{ animation-delay:.8s } .dt3{ animation-delay:1.2s }
    .dt4{ animation-delay:1.6s } .dt5{ animation-delay:2s }
    @keyframes to-dot{ 0%,100%{ opacity:.4; transform:scale(1);} 50%{ opacity:1; transform:scale(1.7);} }

    .ring-glow{ animation: to-ring 4s ease-in-out infinite; }
    @keyframes to-ring{ 0%,100%{ opacity:.75; } 50%{ opacity:1; } }
  </style>

  <defs>
    <radialGradient id="to-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity=".55" />
      <stop offset="45%" stop-color="#312E81" stop-opacity=".28" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="to-core" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>

    <linearGradient id="to-ringA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="to-ringB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="to-react-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1224" /><stop offset="100%" stop-color="#111C3A" />
    </linearGradient>
    <linearGradient id="to-ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="to-tw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#EAF2FF" />
    </linearGradient>
    <linearGradient id="to-node-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" /><stop offset="100%" stop-color="#161616" />
    </linearGradient>
    <linearGradient id="to-pg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" /><stop offset="100%" stop-color="#155E75" />
    </linearGradient>
    <linearGradient id="to-git-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" /><stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="to-vite-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /><stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="to-next-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" /><stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>

    <filter id="to-blur-xl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="34" /></filter>
    <filter id="to-blur-lg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" /></filter>
    <filter id="to-blur-md" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" /></filter>
    <filter id="to-blur-sm" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" /></filter>
    <filter id="to-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity=".35" />
    </filter>
  </defs>

  <!-- ambient bloom -->
  <circle cx="500" cy="500" r="470" fill="url(#to-ambient)" />

  <!-- faint outer guide ring -->
  <circle cx="500" cy="500" r="430" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="2 10" opacity=".35" />

  <!-- rotating comet arcs -->
  <g class="spin-cw">
    <path d="M500,120 A380,380 0 0 1 880,500" fill="none" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" opacity=".55" filter="url(#to-blur-sm)" />
  </g>
  <g class="spin-ccw">
    <path d="M500,880 A380,380 0 0 1 120,500" fill="none" stroke="#C084FC" stroke-width="4" stroke-linecap="round" opacity=".5" filter="url(#to-blur-sm)" />
  </g>

  <!-- thick glowing orbit rings -->
  <circle class="ring-glow" cx="500" cy="500" r="330" fill="none" stroke="url(#to-ringA)" stroke-width="20" opacity=".9" filter="url(#to-blur-md)" />
  <circle cx="500" cy="500" r="330" fill="none" stroke="url(#to-ringA)" stroke-width="14" opacity=".95" />

  <circle class="ring-glow" cx="500" cy="500" r="245" fill="none" stroke="url(#to-ringB)" stroke-width="14" opacity=".85" filter="url(#to-blur-md)" />
  <circle cx="500" cy="500" r="245" fill="none" stroke="url(#to-ringB)" stroke-width="9" opacity=".95" />

  <!-- glowing orbit dots -->
  <circle class="dot dt0" cx="500" cy="170" r="7" fill="#E0F2FE" />
  <circle class="dot dt1" cx="733" cy="288" r="6" fill="#E0E7FF" />
  <circle class="dot dt2" cx="733" cy="712" r="6" fill="#F5D0FE" />
  <circle class="dot dt3" cx="267" cy="712" r="6" fill="#E0E7FF" />
  <circle class="dot dt4" cx="267" cy="288" r="6" fill="#CFFAFE" />
  <circle class="dot dt5" cx="500" cy="255" r="5" fill="#DBEAFE" />

  <!-- central glowing core -->
  <circle class="orb-pulse" cx="500" cy="500" r="175" fill="url(#to-core)" filter="url(#to-blur-xl)" opacity=".8" />
  <circle cx="500" cy="500" r="150" fill="url(#to-core)" />
  <circle cx="500" cy="500" r="150" fill="none" stroke="#93C5FD" stroke-width="2" opacity=".6" />

  <!-- </> glyph -->
  <g filter="url(#to-shadow)">
    <path d="M462,455 L420,500 L462,545" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M538,455 L580,500 L538,545" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M513,432 L487,568" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" />
  </g>

  <!-- ============ TECH BADGES ============ -->

  <!-- React : top -->
  <g class="float b0" transform="translate(500,120)">
    <circle r="90" fill="#38BDF8" opacity=".35" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-react-bg)" stroke="#38BDF8" stroke-width="4" filter="url(#to-shadow)" />
    <g stroke="#22D3EE" stroke-width="4" fill="none">
      <ellipse rx="27" ry="11" />
      <ellipse rx="27" ry="11" transform="rotate(60)" />
      <ellipse rx="27" ry="11" transform="rotate(120)" />
    </g>
    <circle r="6" fill="#22D3EE" />
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">React</text>
  </g>

  <!-- Next.js : upper right -->
  <g class="float b1" transform="translate(768.7,231.3)">
    <circle r="90" fill="#F1F5F9" opacity=".4" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-next-bg)" stroke="#F8FAFC" stroke-width="4" filter="url(#to-shadow)" />
    <text x="0" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">N</text>
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Next.js</text>
  </g>

  <!-- TypeScript : right -->
  <g class="float b2" transform="translate(880,500)">
    <circle r="90" fill="#60A5FA" opacity=".4" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-ts-bg)" stroke="#BFDBFE" stroke-width="4" filter="url(#to-shadow)" />
    <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">TS</text>
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">TypeScript</text>
  </g>

  <!-- Tailwind CSS : lower right -->
  <g class="float b3" transform="translate(768.7,768.7)">
    <circle r="90" fill="#38BDF8" opacity=".3" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-tw-bg)" stroke="#38BDF8" stroke-width="4" filter="url(#to-shadow)" />
    <path d="M-26,-6 C -18,-20 -2,-20 6,-8 C 14,2 22,2 28,-6 C 20,8 4,8 -4,-4 C -12,-14 -20,-14 -26,-6 Z" fill="#0EA5E9" />
    <path d="M-26,14 C -18,0 -2,0 6,12 C 14,22 22,22 28,14 C 20,28 4,28 -4,16 C -12,6 -20,6 -26,14 Z" fill="#38BDF8" />
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Tailwind CSS</text>
  </g>

  <!-- Node.js : bottom -->
  <g class="float b4" transform="translate(500,880)">
    <circle r="90" fill="#4ADE80" opacity=".35" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-node-bg)" stroke="#4ADE80" stroke-width="4" filter="url(#to-shadow)" />
    <path d="M0,-30 L26,-15 V15 L0,30 L-26,15 V-15 Z" fill="none" stroke="#4ADE80" stroke-width="4.5" stroke-linejoin="round" />
    <circle r="6" fill="#4ADE80" />
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Node.js</text>
  </g>

  <!-- PostgreSQL : lower left -->
  <g class="float b5" transform="translate(231.3,768.7)">
    <circle r="90" fill="#22D3EE" opacity=".35" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-pg-bg)" stroke="#67E8F9" stroke-width="4" filter="url(#to-shadow)" />
    <circle cx="0" cy="-10" r="18" fill="#FFFFFF" />
    <circle cx="-15" cy="-16" r="9" fill="#FFFFFF" />
    <path d="M6,2 C 16,6 18,16 12,24 C 8,29 1,27 2,20 C 3,14 -1,12 -3,17 C -5,22 -10,20 -8,14 C -6,6 -2,0 6,2 Z" fill="#FFFFFF" />
    <circle cx="-6" cy="-12" r="2.2" fill="#0E7490" />
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">PostgreSQL</text>
  </g>

  <!-- Git : left -->
  <g class="float b6" transform="translate(120,500)">
    <circle r="90" fill="#FB923C" opacity=".4" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-git-bg)" stroke="#FED7AA" stroke-width="4" filter="url(#to-shadow)" />
    <g stroke="#FFFFFF" stroke-width="4.5" fill="none">
      <circle cx="-15" cy="-16" r="6" />
      <circle cx="-15" cy="16" r="6" />
      <circle cx="16" cy="0" r="6" />
      <path d="M-15,-10 V10" />
      <path d="M-9,-3 C -2,-3 8,-3 11,-1" />
    </g>
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Git</text>
  </g>

  <!-- Vite : upper left -->
  <g class="float b7" transform="translate(231.3,231.3)">
    <circle r="90" fill="#A78BFA" opacity=".4" filter="url(#to-blur-lg)" />
    <circle r="74" fill="url(#to-vite-bg)" stroke="#FDE68A" stroke-width="4" filter="url(#to-shadow)" />
    <path d="M-20,-22 L17,-22 L-2,4 L15,4 L-16,26 L-6,-2 L-22,-2 Z" fill="#FFFFFF" />
    <text x="0" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Vite</text>
  </g>
</svg>
