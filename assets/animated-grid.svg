<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated grid">
  <style>
    :root{
      --bg:#f8fafc; --line:#e2e8f0; --accent:#2563eb; --glow:#93c5fd;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#10151f; --line:#1f2937; --accent:#60a5fa; --glow:#3b82f6; }
    }
    .beam{ animation: ag-sweep 7s ease-in-out infinite; }
    @keyframes ag-sweep{
      0%{ transform: translateX(-120px); opacity:0; }
      12%{ opacity:.9; }
      50%{ transform: translateX(1200px); opacity:.9; }
      62%{ opacity:0; }
      100%{ transform: translateX(1200px); opacity:0; }
    }
    .dash{ stroke-dasharray:4 5; animation: ag-draw 6s linear infinite; }
    @keyframes ag-draw{ to{ stroke-dashoffset:-180; } }
    .blink{ animation: ag-blink 3.2s ease-in-out infinite; }
    @keyframes ag-blink{ 0%,100%{ opacity:.3 } 50%{ opacity:1 } }
  </style>

  <defs>
    <pattern id="ag-cell" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="var(--line)" stroke-width="1" />
    </pattern>
    <linearGradient id="ag-fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="18%" stop-color="white" stop-opacity="1" />
      <stop offset="82%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="ag-mask"><rect width="1200" height="300" fill="url(#ag-fadeY)" /></mask>
    <linearGradient id="ag-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0" />
      <stop offset="50%" stop-color="var(--accent)" stop-opacity=".55" />
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="var(--bg)" />

  <g mask="url(#ag-mask)">
    <rect width="1200" height="300" fill="url(#ag-cell)" />
    <rect class="beam" width="120" height="300" fill="url(#ag-beam)" />

    <path class="dash" d="M60 210 H 340 V 90 H 620" stroke="var(--accent)" stroke-width="1.4" fill="none" opacity=".55" />
    <path class="dash" d="M760 240 H 940 V 60 H 1140" stroke="var(--accent)" stroke-width="1.4" fill="none" opacity=".55" />

    <circle class="blink" cx="60" cy="210" r="3" fill="var(--accent)" />
    <circle class="blink" cx="620" cy="90" r="3" fill="var(--accent)" />
    <circle class="blink" cx="760" cy="240" r="3" fill="var(--glow)" />
    <circle class="blink" cx="1140" cy="60" r="3" fill="var(--glow)" />
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="20" fill="none" stroke="var(--line)" stroke-width="1.5" />
</svg>
