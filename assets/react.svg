<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="atom mark">
  <style>
    :root{ --accent:#2563eb; --soft:#dbeafe; }
    @media (prefers-color-scheme: dark){ :root{ --accent:#60a5fa; --soft:#1e3a5f; } }
    .spin{ transform-box: fill-box; transform-origin: 60px 60px; animation: r-spin 9s linear infinite; }
    @keyframes r-spin{ to{ transform: rotate(360deg); } }
    .core{ animation: r-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 60px 60px; }
    @keyframes r-pulse{ 0%,100%{ opacity:.8 } 50%{ opacity:1 } }
  </style>

  <g class="spin" stroke="var(--accent)" stroke-width="2" fill="none">
    <ellipse cx="60" cy="60" rx="30" ry="12" />
    <ellipse cx="60" cy="60" rx="30" ry="12" transform="rotate(60 60 60)" />
    <ellipse cx="60" cy="60" rx="30" ry="12" transform="rotate(120 60 60)" />
  </g>
  <circle class="core" cx="60" cy="60" r="5" fill="var(--accent)" />
  <circle cx="60" cy="60" r="9" fill="var(--soft)" opacity=".5" />
</svg>
