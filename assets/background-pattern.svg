<svg width="1400" height="140" viewBox="0 0 1400 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="decorative pattern">
  <style>
    :root{
      --bg:#ffffff; --dot:#dbe2ea; --accent:#2563eb; --accent-soft:#93c5fd; --line:#2563eb;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0b0f19; --dot:#1c2333; --accent:#60a5fa; --accent-soft:#3b82f6; --line:#60a5fa; }
    }
    .node{ animation: bp-pulse 3.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .node.d1{ animation-delay:.4s }
    .node.d2{ animation-delay:1.1s }
    .node.d3{ animation-delay:1.9s }
    @keyframes bp-pulse{
      0%,100%{ opacity:.45; r:2.4px; }
      50%{ opacity:1; r:3.4px; }
    }
    .thread{ stroke-dasharray: 6 7; animation: bp-flow 5.5s linear infinite; }
    @keyframes bp-flow{ to{ stroke-dashoffset:-260; } }
  </style>

  <defs>
    <pattern id="bp-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--dot)" />
    </pattern>
    <linearGradient id="bp-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="14%" stop-color="white" stop-opacity="1" />
      <stop offset="86%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="bp-mask">
      <rect width="1400" height="140" fill="url(#bp-fade)" />
    </mask>
  </defs>

  <rect width="1400" height="140" fill="var(--bg)" />

  <g mask="url(#bp-mask)">
    <rect width="1400" height="140" fill="url(#bp-grid)" />

    <path class="thread" d="M120 96 C 260 40, 420 40, 540 78" stroke="var(--line)" stroke-width="1.2" opacity=".4" fill="none" />
    <path class="thread" d="M760 46 C 880 96, 1020 96, 1160 52" stroke="var(--line)" stroke-width="1.2" opacity=".4" fill="none" />

    <circle class="node" cx="120" cy="96" r="2.6" fill="var(--accent)" />
    <circle class="node d1" cx="540" cy="78" r="2.6" fill="var(--accent)" />
    <circle class="node d2" cx="760" cy="46" r="2.6" fill="var(--accent)" />
    <circle class="node d3" cx="1160" cy="52" r="2.6" fill="var(--accent)" />

    <circle cx="330" cy="30" r="1.6" fill="var(--accent-soft)" opacity=".6" />
    <circle cx="960" cy="108" r="1.6" fill="var(--accent-soft)" opacity=".6" />
    <circle cx="1280" cy="70" r="1.6" fill="var(--accent-soft)" opacity=".6" />
  </g>
</svg>
