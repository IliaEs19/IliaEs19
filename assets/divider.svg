<svg width="1200" height="40" viewBox="0 0 1200 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider">
  <style>
    :root{ --line:#e2e8f0; --accent:#2563eb; }
    @media (prefers-color-scheme: dark){ :root{ --line:#1f2937; --accent:#60a5fa; } }
    .node{ animation: dv-pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes dv-pulse{ 0%,100%{ opacity:.55; transform:scale(1);} 50%{ opacity:1; transform:scale(1.35);} }
  </style>

  <defs>
    <linearGradient id="dv-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--line)" stop-opacity="0" />
      <stop offset="100%" stop-color="var(--line)" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="dv-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--line)" stop-opacity="1" />
      <stop offset="100%" stop-color="var(--line)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <line x1="0" y1="20" x2="560" y2="20" stroke="url(#dv-l)" stroke-width="1.5" />
  <line x1="640" y1="20" x2="1200" y2="20" stroke="url(#dv-r)" stroke-width="1.5" />

  <rect x="592" y="12" width="16" height="16" rx="4" transform="rotate(45 600 20)" fill="none" stroke="var(--accent)" stroke-width="1.5" />
  <circle class="node" cx="600" cy="20" r="2.4" fill="var(--accent)" />
</svg>
