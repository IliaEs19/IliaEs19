name: Update README cards
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (Dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=IliaEs19&show_icons=true&count_private=true&title_color=38bdf8&icon_color=38bdf8&text_color=94a3b8&bg_color=0f172a&border_color=1d4ed8&border_radius=20&hide_border=false
          path: profile/stats-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate stats card (Light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=IliaEs19&show_icons=true&count_private=true&title_color=1d4ed8&icon_color=0ea5e9&text_color=475569&bg_color=ffffff&border_color=bfdbfe&border_radius=20&hide_border=false
          path: profile/stats-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate top languages card (Dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=IliaEs19&layout=compact&langs_count=8&title_color=38bdf8&text_color=94a3b8&bg_color=0f172a&border_color=1d4ed8&border_radius=20&hide_border=false
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate top languages card (Light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=IliaEs19&layout=compact&langs_count=8&title_color=1d4ed8&text_color=475569&bg_color=ffffff&border_color=bfdbfe&border_radius=20&hide_border=false
          path: profile/top-langs-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
